[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = [
    "E501",  # длинные строки в промптах и шаблонах сообщений
    "B904",  # raise из except в обработчиках API — осознанно без цепочки
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
